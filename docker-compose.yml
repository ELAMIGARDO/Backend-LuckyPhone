version: '3.8'

services:
  # Base de Datos MySQL 8
  mysqldb:
    image: mysql:8.0
    container_name: luckyphone-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: luckyphone
    ports:
      - "3301:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Aplicación Spring Boot Backend
  app:
    build: .
    container_name: luckyphone-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/luckyphone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: LuckyPhoneSecretKeyForJWTAuthentication2026SuperSecureKey!
      LUCKYPHONE_WHATSAPP_NUMERO: "51934368572"
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:
