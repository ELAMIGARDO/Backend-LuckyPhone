spring.application.name=luckyphonedemo

# Configuración de Base de Datos (Soporta Variables de Entorno con valores por defecto)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/luckyphone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Muestra el SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gestión de tablas (Validado por Flyway en lugar de alteración directa de Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración de Flyway (Versionado de BD)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# CONFIGURACIÓN COMERCIAL LUCKYPHONE
luckyphone.whatsapp.numero=${LUCKYPHONE_WHATSAPP_NUMERO:51934368572}

# Configuración de JWT
app.jwt.secret=${JWT_SECRET:LuckyPhoneSecretKeyForJWTAuthentication2026SuperSecureKey!}
app.jwt.expiration-ms=86400000