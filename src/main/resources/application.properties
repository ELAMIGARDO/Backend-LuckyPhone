spring.application.name=luckyphonedemo

# Verifica si tu puerto es 3301 o 3306
spring.datasource.url=jdbc:mysql://localhost:3301/luckyphone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Muestra el SQL en la consola de forma bonita
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Gestión de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

